<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>EA Academy</title>
  <meta name="description" content="A complete training program for Executive Assistants: the EA role, Microsoft Outlook, and business travel management.">
  <meta name="theme-color" content="#edf0eb" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#11151c" media="(prefers-color-scheme: dark)">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;0,7..72,700;1,7..72,400;1,7..72,600&family=Schibsted+Grotesk:wght@400;500;600;700;800&display=swap">

</head>
<body>
  <header class="topbar">
    <div class="wrap topbar-in">
      <a class="brand" href="#/" aria-label="Home">
        <span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i></span>
        <span id="brandName">EA Academy</span>
      </a>
      <nav class="mainnav" aria-label="Main">
        <a href="#/" data-nav="courses">Courses</a>
        <a href="#/practice" data-nav="practice">Practice</a>
        <a href="#/glossary" data-nav="glossary">Glossary</a>
        <a href="#/certificate" data-nav="certificate">Certificate</a>
        <form class="nav-search" data-search-form role="search">
          <svg class="ic" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg>
          <input type="search" placeholder="Search lessons" aria-label="Search lessons">
        </form>
      </nav>
      <div class="top-tools">
        <form class="top-search" id="searchForm" data-search-form role="search">
          <svg class="ic" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg>
          <input id="searchInput" type="search" placeholder="Search lessons" aria-label="Search lessons">
        </form>
        <a class="acct" id="acctChip" href="#/account" hidden></a>
        <button class="icon-btn" id="themeBtn" type="button" aria-label="Switch theme"></button>
        <button class="icon-btn" id="menuBtn" type="button" aria-label="Open menu">
          <svg class="ic" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
        </button>
      </div>
    </div>
  </header>

  <main id="view" tabindex="-1">
    <noscript><p class="wrap" style="padding:48px 0">EA Academy needs JavaScript. Please enable it in your browser settings.</p></noscript>
  </main>

  <footer class="footer">
    <div class="wrap footer-in">
      <span>&copy; <span id="yr">2026</span> EA Academy. Progress is saved to each signed-in account.</span>
      <span><a href="#/glossary">Glossary</a> &nbsp; <a href="#/certificate">Certificate</a></span>
    </div>
  </footer>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/data/ea-1.js"></script>
  <script src="js/data/ea-2.js"></script>
  <script src="js/data/outlook-1.js"></script>
  <script src="js/data/outlook-2.js"></script>
  <script src="js/data/travel-1.js"></script>
  <script src="js/data/travel-2.js"></script>
  <script src="js/data/scenarios.js"></script>
  <script src="js/data/glossary.js"></script>
  <script src="js/app.js"></script>
  <script src="js/outlook-lab.js"></script>
</body>
</html>
